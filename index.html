<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Grafika Komputer - Game Snake 2D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin-top: 20px;
        }
        canvas {
            border: 3px solid black;
            background-color: #000000;
            display: block;
            margin: 15px auto;
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
        }
        .info {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Game Snake 2D</h2>

    <div class="controls">
        <button id="btnStart">Start</button>
        <button id="btnPause">Pause</button>
        <button id="btnReset">Reset</button>
    </div>

    <canvas id="mycanvas" width="500" height="500"></canvas>

    <script type="module" src="snake.js"></script>
</body>
</html>
